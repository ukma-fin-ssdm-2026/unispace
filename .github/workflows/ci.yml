# Примітка щодо використання ШІ:
# Цей workflow написано за допомогою ШІ (Claude) на основі вимог Lab04 (Code-First генерація OpenAPI,
# перевірка актуальності специфікації) та ролі Integration Lead із TeamCharter.md.
# Верифікація: через pull request - проходження самого CI та рев'ю іншої учасниці команди.
# Lab05: кроки black / flake8 / bandit додано з допомогою ШІ (Claude); команди попередньо
# перевірено локально, результати - у docs/code-quality/static-analysis.md.

name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # Тільки для CI: ключ не є секретом і не використовується ніде, крім тестів.
      SECRET_KEY: ci-only-insecure-key-not-a-secret

    defaults:
      run:
        working-directory: ./Backend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          Backend/requirements.txt
          Backend/requirements-dev.txt

    - name: Install dependencies
      run: pip install -r requirements.txt -r requirements-dev.txt

    # Lab05: статичний аналіз. Конфігурації лежать у Backend/ (pyproject.toml, .flake8, bandit.yaml).
    - name: Check formatting (black)
      run: black --check --diff .

    - name: Lint (flake8)
      run: flake8 .

    - name: Security analysis (bandit)
      run: bandit -r . -c bandit.yaml

    - name: Run simple test
      run: python test_init.py

    - name: Django system check
      run: python manage.py check

    - name: Run Django tests
      run: python manage.py test

    # Code-First: специфікація генерується тільки з коду (drf-spectacular),
    # --validate перевіряє її на відповідність стандарту OpenAPI.
    - name: Generate and validate OpenAPI schema
      run: python manage.py spectacular --file openapi-generated.yaml --validate

    # Закомічений docs/api/openapi-generated.yaml має збігатися з тим, що дає код.
    # Поки файл порожній (ще не згенерований), перевірку пропускаємо з попередженням.
    # Після першого коміту YAML прибрати гілку "skip" і зробити перевірку обов'язковою.
    - name: Check committed schema is up to date
      run: |
        if [ ! -s ../docs/api/openapi-generated.yaml ]; then
          echo "::warning::docs/api/openapi-generated.yaml порожній - перевірку актуальності пропущено"
        elif ! diff -u ../docs/api/openapi-generated.yaml openapi-generated.yaml; then
          echo "::error::docs/api/openapi-generated.yaml застарів. Згенеруйте заново: cd Backend && python manage.py spectacular --file ../docs/api/openapi-generated.yaml"
          exit 1
        fi

    # Згенерований YAML можна скачати зі сторінки запуску (Artifacts) і закомітити.
    - name: Upload generated schema
      uses: actions/upload-artifact@v4
      with:
        name: openapi-generated
        path: Backend/openapi-generated.yaml
