# Примітка щодо використання ШІ:
# Цей workflow написано за допомогою ШІ (Claude) на основі вимог Lab04 (Code-First генерація OpenAPI,
# перевірка актуальності специфікації) та ролі Integration Lead із TeamCharter.md.
# Верифікація: через pull request - проходження самого CI та рев'ю іншої учасниці команди.
# Lab05: кроки black / flake8 / bandit додано з допомогою ШІ (Claude); команди попередньо
# перевірено локально, результати - у docs/code-quality/static-analysis.md.
# Lab05 (бонус): кроки оновлення pip та pip-audit додано з допомогою ШІ (Claude), перевірено локально.
# Lab05: сервіс PostgreSQL і перевірки міграцій додано з допомогою ШІ (Claude), перевірено проходженням CI.
# Lab05: job frontend (ті самі перевірки для Frontend/) додано з допомогою ШІ (Claude).
# Lab06: запуск тестів через pytest з покриттям гілок додано з допомогою ШІ (Claude).

name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: [self-hosted, linux]

    # PostgreSQL для CI (ADR-002): та сама СУБД, що в Docker локально і на Render.
    # Потрібен, бо моделі використовують можливості лише PostgreSQL (ExclusionConstraint).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: unispace_ci
          POSTGRES_USER: unispace
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unispace -d unispace_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Тільки для CI: ключ і пароль не є секретами і не використовуються ніде, крім тестів.
      SECRET_KEY: ci-only-insecure-key-not-a-secret
      DATABASE_URL: postgresql://unispace:ci-only-password@localhost:5432/unispace_ci

    defaults:
      run:
        working-directory: ./Backend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          Backend/requirements.txt
          Backend/requirements-dev.txt

    # Оновлюємо сам pip: старі версії pip мають відомі вразливості (див. static-analysis.md, D-1).
    # Версію зафіксовано, а --only-binary не дає виконувати setup-скрипти під час встановлення (SonarCloud S8541, S8544).
    - name: Upgrade pip
      run: "python -m pip install --only-binary=:all: pip==26.2.2"

    - name: Install dependencies
      run: "pip install --only-binary :all: --require-hashes -r requirements.txt -r requirements-dev.txt"

    # Аудит залежностей: звіряє версії з базою відомих вразливостей (PyPI Advisory / OSV).
    - name: Dependency audit (pip-audit)
      run: pip-audit -r requirements.txt -r requirements-dev.txt

    # Lab05: статичний аналіз. Конфігурації лежать у Backend/ (pyproject.toml, .flake8, bandit.yaml).
    - name: Check formatting (black)
      run: black --check --diff .

    - name: Lint (flake8)
      run: flake8 .

    - name: Security analysis (bandit)
      run: bandit -r . -c bandit.yaml

    - name: Django system check
      run: python manage.py check

    # Падає, якщо моделі змінено, а міграцію не згенеровано.
    - name: Check for missing migrations
      run: python manage.py makemigrations --check --dry-run

    # Падає, якщо міграції не застосовуються до справжньої бази PostgreSQL.
    - name: Apply migrations (PostgreSQL)
      run: python manage.py migrate --noinput

    # Тести (Backend/api/tests/test_*.py) з покриттям гілок; налаштування - Backend/pyproject.toml.
    - name: Run tests with coverage and gate (pytest)
      run: >-
        pytest -v --cov=api --cov-branch --cov-report=term-missing --cov-report=html
        --cov-report=json:coverage.json --junitxml=test-results.xml --cov-fail-under=75

    # Відпрацювання Lab07: підсумок тестів і покриття на сторінці прогону (Summary).
    # if: always() - щоб підсумок був і тоді, коли тести впали.
    # Скрипт - Backend/scripts/ci_summary.py (додано з допомогою ШІ, Claude).
    - name: Write test and coverage summary
      if: always()
      env:
        COVERAGE_THRESHOLD: 75
      run: python scripts/ci_summary.py >> "$GITHUB_STEP_SUMMARY"

    # Lab07: тести скриптів CI - перевірки простежуваності (її запускає job traceability) і підсумку прогону.
    - name: Test the CI scripts (traceability, summary)
      run: python -m pytest scripts/tests -q -o addopts=""

    # Code-First: специфікація генерується тільки з коду (drf-spectacular),
    # --validate перевіряє її на відповідність стандарту OpenAPI.
    - name: Generate and validate OpenAPI schema
      run: python manage.py spectacular --file openapi-generated.yaml --validate

    # Закомічений docs/api/openapi-generated.yaml має збігатися з тим, що дає код.
    - name: Check committed schema is up to date
      run: |
        if ! diff -u ../docs/api/openapi-generated.yaml openapi-generated.yaml; then
          echo "::error::docs/api/openapi-generated.yaml застарів. Згенеруйте заново: cd Backend && python manage.py spectacular --file ../docs/api/openapi-generated.yaml"
          exit 1
        fi

    # Згенерований YAML можна скачати зі сторінки запуску (Artifacts) і закомітити.
    - name: Upload generated schema
      uses: actions/upload-artifact@v4
      with:
        name: openapi-generated
        path: Backend/openapi-generated.yaml

    # HTML-звіт покриття можна скачати зі сторінки запуску (Artifacts) і відкрити htmlcov/index.html.
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html
        path: Backend/htmlcov/

  # Lab07 (бонус): автоматична перевірка простежуваності. Скрипт зіставляє ID вимог з docs/requirements/rtm.md
  # з мітками @pytest.mark.req у тестах і валить збірку, якщо вимога без тесту або тест без вимоги.
  # Свідомі винятки (ще не реалізовані вимоги тощо) з поясненнями - у Backend/traceability.toml.
  # Додано з допомогою ШІ (Claude).
  traceability:
    runs-on: [self-hosted, linux]

    defaults:
      run:
        working-directory: ./Backend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Скрипту достатньо стандартної бібліотеки, тож тут нічого не встановлюється.
    # Тести самого скрипта запускаються в job build-and-test, де pytest уже є.
    # Таблиця "вимога -> тести" також потрапляє на сторінку прогону (Summary); pipefail зберігає код виходу скрипта.
    - name: Check requirements traceability (RTM <-> tests)
      shell: bash
      run: python scripts/check_traceability.py | tee -a "$GITHUB_STEP_SUMMARY"

  # Lab05: перевірки фронтенду (окремий Django-проєкт у Frontend/) після огляду іншої команди.
  frontend:
    runs-on: [self-hosted, linux]

    env:
      # Тільки для CI: ключ не є секретом і не використовується ніде, крім перевірок.
      SECRET_KEY: ci-only-insecure-key-not-a-secret

    defaults:
      run:
        working-directory: ./Frontend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          Frontend/requirements.txt
          Frontend/requirements-dev.txt

    - name: Upgrade pip
      run: "python -m pip install --only-binary=:all: pip==26.2.2"

    - name: Install dependencies
      run: "pip install --only-binary :all: --require-hashes -r requirements.txt -r requirements-dev.txt"

    - name: Dependency audit (pip-audit)
      run: pip-audit -r requirements.txt -r requirements-dev.txt

    - name: Check formatting (black)
      run: black --check --diff .

    - name: Lint (flake8)
      run: flake8 .

    - name: Security analysis (bandit)
      run: bandit -r . -c bandit.yaml

    - name: Django system check
      run: python manage.py check
