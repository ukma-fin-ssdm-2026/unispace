[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = '''
/(
    \.venv
  | migrations
  | staticfiles
)/
'''

# --- Тести та покриття (Lab06) ---
# Запуск з папки Backend/:
#   pytest --cov=api --cov-branch --cov-report=term-missing --cov-report=html
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "Backend.settings"
python_files = ["tests.py", "test_*.py"]
testpaths = ["api"]
addopts = "-ra"
markers = [
    "req(*ids): ID вимог з docs/requirements/rtm.md, які перевіряє тест (перевірка: scripts/check_traceability.py)",
]

[tool.coverage.run]
branch = true
source = ["api"]
omit = ["*/migrations/*", "*/tests/*", "*/tests.py", "*/test_*.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.mutmut]
source_paths = ["api/services/booking_rules.py"]
pytest_add_cli_args_test_selection = ["api/tests/test_booking_rules.py"]
also_copy = ["Backend", "api", "manage.py", "pyproject.toml"]
