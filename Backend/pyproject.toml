[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = '''
/(
    \.venv
  | migrations
  | staticfiles
)/
'''

# --- Тести та покриття (Lab06) ---
# Запуск з папки Backend/:
#   pytest --cov=api --cov-branch --cov-report=term-missing --cov-report=html
# HTML-звіт: Backend/htmlcov/index.html (не комітиться, див. .gitignore).
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "Backend.settings"
python_files = ["tests.py", "test_*.py"]
testpaths = ["api"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["api"]
omit = ["*/migrations/*", "*/tests.py", "*/test_*.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
