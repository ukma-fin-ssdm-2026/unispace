{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід - UniSpace</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <div class="login-card">
        <i class="fa-solid fa-layer-group login-icon"></i>
        <h1 class="login-title">UniSpace</h1>
        <p class="login-subtitle">
            Система керування аудиторним фондом
        </p>

        <!-- Існуюча кнопка Microsoft (для продакшну) -->
        <a href="https://unispace-wtf6.onrender.com/auth/microsoft/login/" class="login-btn">
            <i class="fa-brands fa-microsoft"></i> Увійти через Microsoft
        </a>

        <!-- НОВИЙ БЛОК ДЛЯ ЛОКАЛЬНОГО ТЕСТУВАННЯ -->
        <div class="dev-login-section">
            <p class="dev-login-title">🛠 Локальне тестування (Dev Login)</p>
            <div class="dev-login-buttons">
                <button onclick="window.location.href=`http://${window.location.hostname}:8000/auth/dev-login/?role=dispatcher`" class="btn-dev-login">
                    Увійти як Диспетчер
                </button>
                <button onclick="window.location.href=`http://${window.location.hostname}:8000/auth/dev-login/?role=teacher`" class="btn-dev-login">
                    Увійти як Викладач
                </button>
                <button onclick="window.location.href=`http://${window.location.hostname}:8000/auth/dev-login/?role=student`" class="btn-dev-login">
                    Увійти як Студент
                </button>
            </div>
        </div>
    </div>
</body>
</html>
