openapi: 3.0.3
info:
  title: UniSpace API
  version: 1.0.0
  description: API для системи керування аудиторним фондом UniSpace
paths:
  /api/v1/audit-logs/:
    get:
      operationId: api_v1_audit_logs_list
      description: 'Диспетчер переглядає записи про перенесення й скасування бронювань:
        час, автор, попередня та нова аудиторії, причина. Найновіші записи першими.
        Тільки для читання: редагувати чи видаляти записи через API неможливо.'
      summary: Історія змін бронювань (аудит-лог)
      parameters:
      - in: query
        name: action
        schema:
          enum:
          - room_changed
          - cancelled
          type: string
          minLength: 1
        description: |-
          Тип дії: перенесення чи скасування

          * `room_changed` - room_changed
          * `cancelled` - cancelled
      - in: query
        name: booking_id
        schema:
          type: string
          format: uuid
        description: Лише записи цього бронювання
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Початок періоду (включно)
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Кінець періоду (включно)
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
        description: Кількість записів
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Зсув
      - in: query
        name: room_id
        schema:
          type: string
          format: uuid
        description: Записи, де аудиторія була попередньою або новою
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogEntry'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: api_v1_auth_me_retrieve
      summary: Поточний користувач
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/v1/bookings/:
    post:
      operationId: api_v1_bookings_create
      summary: Створити бронювання
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
            examples:
              ПрикладВхіднихДанихДляБронювання:
                value:
                  room_id: 123e4567-e89b-12d3-a456-426614174000
                  lesson_id: 987f6543-e21b-34c1-b567-112233445566
                summary: Приклад вхідних даних для бронювання
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreate'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
              examples:
                ПрикладВхіднихДанихДляБронювання:
                  value:
                    room_id: 123e4567-e89b-12d3-a456-426614174000
                    lesson_id: 987f6543-e21b-34c1-b567-112233445566
                  summary: Приклад вхідних даних для бронювання
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/bookings/{id}/:
    get:
      operationId: api_v1_bookings_retrieve
      summary: Отримати бронювання
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
              examples:
                ПрикладВхіднихДанихДляБронювання:
                  value:
                    room_id: 123e4567-e89b-12d3-a456-426614174000
                    lesson_id: 987f6543-e21b-34c1-b567-112233445566
                  summary: Приклад вхідних даних для бронювання
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    delete:
      operationId: api_v1_bookings_destroy
      description: 'Бронювання не видаляється: отримує статус cancelled, у журнал
        аудиту додається запис.'
      summary: Скасувати бронювання
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/bookings/{id}/alternatives/:
    get:
      operationId: api_v1_bookings_alternatives_retrieve
      description: 'Аудиторії, вільні на час заняття: доступні, не менші за потрібну
        місткість і без активних бронювань, що перетинаються з заняттям (FR-010).
        Початковий пошук обмежено бажаним корпусом; якщо там варіантів немає, у відповіді
        є повідомлення з пропозицією повторити запит з expand=true. Після розширення
        спершу йде бажаний корпус, далі - найменша достатня місткість.'
      summary: Підібрати вільні аудиторії для заміни
      parameters:
      - in: query
        name: building
        schema:
          type: string
          maxLength: 20
          minLength: 1
        description: Бажаний корпус; за замовчуванням - корпус поточної аудиторії
      - in: query
        name: expand
        schema:
          type: boolean
          default: false
        description: false - лише бажаний корпус (FR-010); true - розширити пошук
          на інші корпуси
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: min_capacity
        schema:
          type: integer
          minimum: 1
        description: Мінімальна місткість; за замовчуванням - місткість поточної аудиторії
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomAlternativesResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/bookings/{id}/change/:
    post:
      operationId: api_v1_bookings_change_create
      description: Переносить заняття в іншу аудиторію, пише запис в аудит і сповіщає
        групу.
      summary: Змінити аудиторію бронювання
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingChangeRoom'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingChangeRoom'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingChangeRoom'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
              examples:
                ПрикладВхіднихДанихДляБронювання:
                  value:
                    room_id: 123e4567-e89b-12d3-a456-426614174000
                    lesson_id: 987f6543-e21b-34c1-b567-112233445566
                  summary: Приклад вхідних даних для бронювання
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/rooms/:
    get:
      operationId: api_v1_rooms_list
      summary: Отримати список аудиторій
      parameters:
      - in: query
        name: building
        schema:
          type: string
          minLength: 1
        description: Корпус
      - in: query
        name: capacity
        schema:
          type: integer
          minimum: 1
        description: Мінімальна місткість
      - in: query
        name: has_computers
        schema:
          type: boolean
          nullable: true
        description: Лише аудиторії з комп'ютерами
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          default: 20
        description: Кількість записів
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Зсув
      - in: query
        name: projector_working
        schema:
          type: boolean
          nullable: true
        description: Лише аудиторії зі справним проєктором
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    post:
      operationId: api_v1_rooms_create
      summary: Створити аудиторію
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoomWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoomWrite'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/rooms/{id}/:
    get:
      operationId: api_v1_rooms_retrieve
      summary: Отримати аудиторію
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    patch:
      operationId: api_v1_rooms_partial_update
      summary: Оновити аудиторію
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoomWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRoomWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRoomWrite'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    delete:
      operationId: api_v1_rooms_destroy
      description: Аудиторію з бронюваннями, конфліктами чи записами аудиту видалити
        не можна.
      summary: Видалити аудиторію
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/rooms/available-slots/:
    get:
      operationId: api_v1_rooms_available_slots_retrieve
      summary: Пошук вільних слотів
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: room_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableSlotsResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/schedule/:
    get:
      operationId: api_v1_schedule_list
      description: Студент бачить розклад своєї групи, викладач - власні заняття,
        диспетчер - будь-які (з можливістю відфільтрувати за групою). Тільки для читання.
      summary: Розклад занять
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Початок періоду (включно)
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Кінець періоду (включно)
      - in: query
        name: group_id
        schema:
          type: string
          format: uuid
        description: Група (лише для диспетчера)
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
        description: Кількість записів
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Зсув
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleItem'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/sync/:
    post:
      operationId: api_v1_sync_create
      description: Ручний запуск синхронізації.
      summary: Запустити імпорт розкладу
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncLog'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/sync-logs/:
    get:
      operationId: api_v1_sync_logs_list
      description: Повертає список логів імпорту розкладу із САЗ.
      summary: Отримати історію синхронізацій
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SyncLog'
          description: ''
  /api/v1/users/me/bookings/:
    get:
      operationId: api_v1_users_me_bookings_list
      summary: Бронювання поточного користувача
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          default: 10
      - in: query
        name: next_cursor
        schema:
          type: string
          minLength: 1
        description: Пагінація за курсором
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingResponse'
              examples:
                ПрикладВхіднихДанихДляБронювання:
                  value:
                  - room_id: 123e4567-e89b-12d3-a456-426614174000
                    lesson_id: 987f6543-e21b-34c1-b567-112233445566
                  summary: Приклад вхідних даних для бронювання
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
components:
  schemas:
    AuditLogEntry:
      type: object
      description: 'Запис аудиту лише для читання: хто, коли, з якої аудиторії в яку
        і чому (FR-017).'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        booking_id:
          type: string
          format: uuid
          readOnly: true
        subject:
          type: string
          readOnly: true
          description: Назва дисципліни
        action:
          type: string
          title: Дія
          maxLength: 50
        user:
          allOf:
          - $ref: '#/components/schemas/AuditLogUser'
          readOnly: true
          description: Автор дії
        previous_room:
          allOf:
          - $ref: '#/components/schemas/ScheduleRoom'
          readOnly: true
          nullable: true
          description: Попередня аудиторія
        new_room:
          allOf:
          - $ref: '#/components/schemas/ScheduleRoom'
          readOnly: true
          nullable: true
          description: Нова аудиторія; null для скасування бронювання
        reason:
          type: string
          title: Причина
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата дії
      required:
      - action
      - booking_id
      - created_at
      - id
      - new_room
      - previous_room
      - subject
      - user
    AuditLogUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          title: Університетська електронна пошта
          maxLength: 254
        full_name:
          type: string
          title: Повне ім'я
          maxLength: 255
      required:
      - email
      - id
    AvailableSlotsResponse:
      type: object
      properties:
        room_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        available_slots:
          type: array
          items:
            type: string
      required:
      - available_slots
      - date
      - room_id
    BookingChangeRoom:
      type: object
      properties:
        room_id:
          type: string
          format: uuid
          description: ID нової аудиторії
        reason:
          type: string
          default: ''
          description: Причина зміни аудиторії
      required:
      - room_id
    BookingCreate:
      type: object
      properties:
        room_id:
          type: string
          format: uuid
          description: ID аудиторії
        lesson_id:
          type: string
          format: uuid
          description: ID заняття
      required:
      - lesson_id
      - room_id
    BookingResponse:
      type: object
      properties:
        room_id:
          type: string
          format: uuid
          description: ID аудиторії
        lesson_id:
          type: string
          format: uuid
          description: ID заняття
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingResponseStatusEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
          description: Назва дисципліни
