          maxLength: 20
        number:
          type: string
          title: Номер аудиторії
          maxLength: 30
      required:
      - building
      - id
      - number
    SyncLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        started_at:
          type: string
          format: date-time
          description: Час початку синхронізації
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: Час завершення синхронізації
        status:
          allOf:
          - $ref: '#/components/schemas/SyncStatusEnum'
          description: |-
            Поточний статус синхронізації

            * `in_progress` - in_progress
            * `success` - success
            * `failed` - failed
        trigger:
          allOf:
          - $ref: '#/components/schemas/TriggerEnum'
          description: |-
            Джерело запуску (ручний диспетчером чи за розкладом)

            * `manual` - manual
            * `scheduled` - scheduled
        error_message:
          type: string
          nullable: true
          description: Текст помилки парсингу або мережі, якщо статус failed
      required:
      - id
      - started_at
      - status
      - trigger
    SyncResult:
      type: object
      description: Запис журналу синхронізації та підсумок імпорту (null, якщо імпорт
        не вдався).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        started_at:
          type: string
          format: date-time
          description: Час початку синхронізації
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: Час завершення синхронізації
        status:
          allOf:
          - $ref: '#/components/schemas/SyncStatusEnum'
          description: |-
            Поточний статус синхронізації

            * `in_progress` - in_progress
            * `success` - success
            * `failed` - failed
        trigger:
          allOf:
          - $ref: '#/components/schemas/TriggerEnum'
          description: |-
            Джерело запуску (ручний диспетчером чи за розкладом)

            * `manual` - manual
            * `scheduled` - scheduled
        error_message:
          type: string
          nullable: true
          description: Текст помилки парсингу або мережі, якщо статус failed
        summary:
          allOf:
          - $ref: '#/components/schemas/SazImportSummary'
          nullable: true
      required:
      - id
      - started_at
      - status
      - summary
      - trigger
    SyncStatusEnum:
      enum:
      - in_progress
      - success
      - failed
      type: string
      description: |-
        * `in_progress` - in_progress
        * `success` - success
        * `failed` - failed
    TriggerEnum:
      enum:
      - manual
      - scheduled
      type: string
      description: |-
        * `manual` - manual
        * `scheduled` - scheduled
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
