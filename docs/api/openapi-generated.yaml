openapi: 3.0.3
info:
  title: UniSpace API
  version: 1.0.0
  description: API для системи керування аудиторним фондом UniSpace
paths:
  /api/v1/bookings/:
    post:
      operationId: v1_bookings_create
      summary: Створити бронювання
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
            examples:
              ПрикладВхіднихДанихДляБронювання:
                value:
                  room_id: 123e4567-e89b-12d3-a456-426614174000
                  lesson_id: 987f6543-e21b-34c1-b567-112233445566
                summary: Приклад вхідних даних для бронювання
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreate'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
              examples:
                ПрикладВхіднихДанихДляБронювання:
                  value:
                    room_id: 123e4567-e89b-12d3-a456-426614174000
                    lesson_id: 987f6543-e21b-34c1-b567-112233445566
                  summary: Приклад вхідних даних для бронювання
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/bookings/{id}/:
    delete:
      operationId: v1_bookings_destroy
      summary: Скасувати бронювання
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/rooms/:
    get:
      operationId: v1_rooms_list
      summary: Отримати список аудиторій
      parameters:
      - in: query
        name: capacity
        schema:
          type: integer
          minimum: 1
        description: Мінімальна місткість
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          default: 20
        description: Кількість записів
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Зсув
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/rooms/available-slots/:
    get:
      operationId: v1_rooms_available_slots_retrieve
      summary: Пошук вільних слотів
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: room_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableSlotsResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/sync/:
    post:
      operationId: v1_sync_create
      description: Ручний запуск синхронізації.
      summary: Запустити імпорт розкладу
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncLog'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/sync-logs/:
    get:
      operationId: v1_sync_logs_list
      description: Повертає список логів імпорту розкладу із САЗ.
      summary: Отримати історію синхронізацій
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SyncLog'
          description: ''
  /api/v1/users/me/bookings/:
    get:
      operationId: v1_users_me_bookings_list
      summary: Бронювання поточного користувача
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          default: 10
      - in: query
        name: next_cursor
        schema:
          type: string
          minLength: 1
        description: Пагінація за курсором
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingResponse'
              examples:
                ПрикладВхіднихДанихДляБронювання:
                  value:
                  - room_id: 123e4567-e89b-12d3-a456-426614174000
                    lesson_id: 987f6543-e21b-34c1-b567-112233445566
                  summary: Приклад вхідних даних для бронювання
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
components:
  schemas:
    AvailableSlotsResponse:
      type: object
      properties:
        room_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        available_slots:
          type: array
          items:
            type: string
      required:
      - available_slots
      - date
      - room_id
    BookingCreate:
      type: object
      properties:
        room_id:
          type: string
          format: uuid
          description: ID аудиторії
        lesson_id:
          type: string
          format: uuid
          description: ID заняття
      required:
      - lesson_id
      - room_id
    BookingResponse:
      type: object
      properties:
        room_id:
          type: string
          format: uuid
          description: ID аудиторії
        lesson_id:
          type: string
          format: uuid
          description: ID заняття
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          type: string
          default: booked
        title:
          type: string
          readOnly: true
          description: Назва дисципліни
        start_time:
          type: string
          format: date-time
          readOnly: true
        end_time:
          type: string
          format: date-time
          readOnly: true
      required:
      - end_time
      - id
      - lesson_id
      - room_id
      - start_time
      - title
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          description: Поле з помилкою
        message:
          type: string
          description: Опис помилки
        provided_value: {}
      required:
      - field
      - message
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorSchema'
      required:
      - error
    ErrorSchema:
      type: object
      properties:
        code:
          type: string
          default: VALIDATION_ERROR
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string
          default: req_abc123
        documentation:
          type: string
          format: uri
      required:
      - documentation
      - message
    Room:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        building:
          type: string
          title: Корпус
          maxLength: 20
        number:
          type: string
          title: Номер аудиторії
          description: Назва або номер аудиторії (напр., 4-230)
          maxLength: 30
        capacity:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Місткість
          description: Місткість (кількість посадкових місць)
        has_computers:
          type: boolean
          title: Наявність комп'ютерів
        projector_working:
          type: boolean
          title: Справний проєктор
      required:
      - building
      - capacity
      - id
      - number
    StatusEnum:
      enum:
      - in_progress
      - success
      - failed
      type: string
      description: |-
        * `in_progress` - in_progress
        * `success` - success
        * `failed` - failed
    SyncLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        started_at:
          type: string
          format: date-time
          description: Час початку синхронізації
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: Час завершення синхронізації
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          description: |-
            Поточний статус синхронізації

            * `in_progress` - in_progress
            * `success` - success
            * `failed` - failed
        trigger:
          allOf:
          - $ref: '#/components/schemas/TriggerEnum'
          description: |-
            Джерело запуску (ручний диспетчером чи за розкладом)

            * `manual` - manual
            * `scheduled` - scheduled
        error_message:
          type: string
          nullable: true
          description: Текст помилки парсингу або мережі, якщо статус failed
      required:
      - id
      - started_at
      - status
      - trigger
    TriggerEnum:
      enum:
      - manual
      - scheduled
      type: string
      description: |-
        * `manual` - manual
        * `scheduled` - scheduled
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
